name: CI - Run E2E Tests

on:
  push:
    branches:
      - "**"
  repository_dispatch:
    types: [run-e2e-tests]
  workflow_dispatch:
    inputs:
      gateway_tag:
        description: 'Docker tag for gateway service'
        required: false
        type: string
      auth_service_tag:
        description: 'Docker tag for auth-service'
        required: false
        type: string
      data_importer_tag:
        description: 'Docker tag for data-importer'
        required: false
        type: string
      profile_service_tag:
        description: 'Docker tag for profile-service'
        required: false
        type: string
      project_service_tag:
        description: 'Docker tag for project-service'
        required: false
        type: string
      mentor_service_tag:
        description: 'Docker tag for mentor-service'
        required: false
        type: string
      job_market_analytics_service_tag:
        description: 'Docker tag for job-market-analytics-service'
        required: false
        type: string
      telegram_bot_adapter_tag:
        description: 'Docker tag for telegram-bot-adapter'
        required: false
        type: string


permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Run E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Set only provided service tag vars
        env:
          INPUTS_JSON: ${{ toJson(github.event.inputs) }}
          PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
        run: |
          declare -A MAP=(
            [gateway_tag]=GATEWAY_DOCKER_IMAGE_TAG
            [auth_service_tag]=AUTH_SERVICE_DOCKER_IMAGE_TAG
            [data_importer_tag]=DATA_IMPORTER_DOCKER_IMAGE_TAG
            [profile_service_tag]=PROFILE_SERVICE_DOCKER_IMAGE_TAG
            [project_service_tag]=PROJECT_SERVICE_DOCKER_IMAGE_TAG
            [mentor_service_tag]=MENTOR_SERVICE_DOCKER_IMAGE_TAG
            [job_market_analytics_service_tag]=JOB_MARKET_ANALYTICS_SERVICE_DOCKER_IMAGE_TAG
            [telegram_bot_adapter_tag]=TELEGRAM_BOT_ADAPTER_DOCKER_IMAGE_TAG
          )

          for key in "${!MAP[@]}"; do
            env_name="${MAP[$key]}"

            value=$(echo "$INPUTS_JSON" | jq -r --arg k "$key" '.[$k] // empty')
            if [ -z "$value" ]; then
              value=$(echo "$PAYLOAD_JSON" | jq -r --arg k "$key" '.[$k] // empty')
            fi

            if [ -n "$value" ]; then
              echo "${env_name}=${value}" >> "$GITHUB_ENV"
              echo "Set ${env_name}=${value}"
            fi
          done


      - name: Set TESTCONTAINER_DOCKER_IMAGES_TAG if provided
        run: |
          TESTCONTAINER_DOCKER_IMAGES_TAG="${{ vars.TESTCONTAINER_DOCKER_IMAGES_TAG }}"
          if [ -n "$TESTCONTAINER_DOCKER_IMAGES_TAG" ]; then
            echo "TESTCONTAINER_DOCKER_IMAGES_TAG=${TESTCONTAINER_DOCKER_IMAGES_TAG}" >> "$GITHUB_ENV"
          else
            echo "Absent TESTCONTAINER_DOCKER_IMAGES_TAG!"
          fi
          
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run E2E tests
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          HH_APP_ACCESS_TOKEN: ${{ secrets.HH_APP_ACCESS_TOKEN }}
          HH_APP_EMAIL: ${{ secrets.HH_APP_EMAIL }}
          GOOGLE_TEST_SPREADSHEET_ID: ${{ secrets.GOOGLE_TEST_SPREADSHEET_ID }}
          GOOGLE_SOURCE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SOURCE_SPREADSHEET_ID }}
        run: ./gradlew test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
