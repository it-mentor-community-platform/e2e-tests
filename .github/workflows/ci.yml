name: CI - Run E2E Tests

on:
  push:
    branches:
      - "**"
  repository_dispatch:
    types: [run-e2e-tests]
  workflow_dispatch:


permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Run E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run E2E tests
        env:
          GATEWAY_DOCKER_IMAGE_TAG: ${{ github.event.client_payload.gateway_tag || 'dev' }}
          AUTH_SERVICE_DOCKER_IMAGE_TAG: ${{ github.event.client_payload.auth_service_tag || 'dev' }}
          DATA_IMPORTER_DOCKER_IMAGE_TAG: ${{ github.event.client_payload.data_importer_tag || 'dev' }}
          PROFILE_SERVICE_DOCKER_IMAGE_TAG: ${{ github.event.client_payload.profile_service_tag || 'dev' }}
          PROJECT_SERVICE_DOCKER_IMAGE_TAG: ${{ github.event.client_payload.project_service_tag || 'dev' }}
          MENTOR_SERVICE_DOCKER_IMAGE_TAG: ${{ github.event.client_payload.mentor_service_tag || 'dev' }}
          JOB_MARKET_ANALYTICS_SERVICE_DOCKER_IMAGE_TAG: ${{ github.event.client_payload.job_market_analytics_service_tag || 'dev' }}
          TELEGRAM_BOT_ADAPTER_DOCKER_IMAGE_TAG: ${{ github.event.client_payload.telegram_bot_adapter_tag || 'dev' }}

          TESTCONTAINER_DOCKER_IMAGES_TAG: dev
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          HH_APP_ACCESS_TOKEN: ${{ secrets.HH_APP_ACCESS_TOKEN }}
          HH_APP_EMAIL: ${{ secrets.HH_APP_EMAIL }}
          GOOGLE_TEST_SPREADSHEET_ID: ${{ secrets.GOOGLE_TEST_SPREADSHEET_ID }}
          GOOGLE_SOURCE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SOURCE_SPREADSHEET_ID }}
        run: ./gradlew test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/